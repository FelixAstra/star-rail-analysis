name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check all JS
        run: |
          status=0
          while IFS= read -r f; do
            node --check "$f" || status=1
          done < <(git ls-files '*.js')
          exit $status

      - name: Divination engine assertions (offline, data-independent)
        run: node tools/verify-divination.js

      - name: Dashboard statistics & forecast assertions (offline, data-independent)
        run: node tools/verify-dashboard.js

      - name: Banner-phase mapping & aggregation assertions (offline, data-independent)
        run: node tools/verify-banner-phase.js

      - name: i18n coverage (zh + en)
        run: node tools/check-i18n.js

      - name: Boot smoke test (empty data, 10 endpoints)
        run: node tools/ci-smoke.js
